<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="assets/css/mystyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration </title>
</head>
<body>
    <div class="form-container">
        <h2>Student Registration </h2>
        <p>Please fill in your details below</p>
        <form action="">
            <div class="form-group">
                <label for="">Full Name</label>
                <input type="text" placeholder="Enter Full Name" required>
            </div>
            <div class="form-group">
                <label for="">Email</label>
                <input type="email" placeholder="Enter Email" required>
            </div>
            <div class="form-group">
                <label for="">Date of Birth</label>
                <input type="date" required>
            </div>
            <div class="form-group">
                <label for="">Phone Number</label>
                <input type="text" placeholder="Enter Phone Number" required>
            </div>
            <div class="form-group">
                <label for="">Male</label>
                <input type="radio" name="gender" required>
                <label for="">Female</label>
                <input type="radio" name="gender" required>
                <label for="">Others</label>
                <input type="radio" name="gender" required>
            </div>
            <div class="form-group">
            <label for="">Courses</label>
            <select name="" id="">
                <option value="js">JavaScript</option>
                <option value="web">WebDevelopment</option>
                <option value="cyber">CyberSecurity</option>
                <option value="data">Datascience</option>
                <option value="">Mobile App development</option>
            </select>
            </div>
        <div class="form-group">
            <label for="">Address</label>
            <textarea placeholder="Enter Your Address" name="Address" id=""></textarea>
        </div>
        <button class="btn">Register Student</button>
    </div>
